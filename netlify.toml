[build]
  command = "curl -fsSL https://bun.sh/install | bash && ~/.bun/bin/bun install && ~/.bun/bin/bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "src/lib"

[[redirects]]
  from = "/api/visitor-info"
  to = "/.netlify/functions/visitor-info"
  status = 200